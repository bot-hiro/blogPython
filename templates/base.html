<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Blog{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block css_extra %}{% endblock %}
</head>
<body>
  <header class="topo">
    <div class="topo-conteudo">
      <a class="logo" href="{{ url_for('ian.home') }}">Blog</a>
      <nav class="menu" aria-label="Principal">
        <a href="{{ url_for('ian.home') }}" class="{% if request.endpoint == 'ian.home' %}ativo{% endif %}">Início</a>
        <a href="#">Categorias</a>
        <a href="#">Tags</a>
        <a href="#">Favoritos</a>
        {% if current_user.is_authenticated %}
          <a class="botao" href="{{ url_for('amanda.sair') }}">Sair</a>
        {% else %}
          <a class="botao" href="{{ url_for('amanda.login') }}">Entrar</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main>
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
