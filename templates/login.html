{% extends "base.html" %}
{% block titulo %}Entrar · Blog{% endblock %}

{% block conteudo %}
<section class="pagina pagina-centro">
  <div class="caixa-login">
    <h1>Entrar no blog</h1>
    <p class="subtitulo">Use seu e-mail e senha.</p>

    {% with mensagens = get_flashed_messages() %}
      {% for m in mensagens %}<p class="erro" role="alert">{{ m }}</p>{% endfor %}
    {% endwith %}

    <form method="post">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" placeholder="seu@email.com" required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" placeholder="Senha" required>
      <button type="submit" class="botao botao-cheio">Entrar</button>
    </form>

    <p class="rodape-caixa">Ainda não tem conta? <a href="#">Criar conta</a></p>
  </div>
</section>
{% endblock %}
